apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-app-vars
  namespace: plane
data:
  # License and Enterprise Configuration
  PRIME_HOST: "https://prime.plane.so"
  MACHINE_SIGNATURE: "1cc520b3830d49399d60ea7e07cf1f000eced636bcaf1c92e72e8b90edb238bb"
  APP_DOMAIN: "plane.example.com"
  APP_VERSION: "v2.3.4"
  
  # Internal Service URLs
  PAYMENT_SERVER_BASE_URL: "http://plane-monitor:8080/"
  FEATURE_FLAG_SERVER_BASE_URL: "http://plane-monitor:8080/"
  LIVE_BASE_URL: "http://plane-live:3000/"
  LIVE_BASE_PATH: "/live"
  
  # Application Settings
  API_KEY_RATE_LIMIT: "60/minute"
  MINIO_ENDPOINT_SSL: "0"
  USE_STORAGE_PROXY: "0"
  INTAKE_EMAIL_DOMAIN: ""
  IS_AIRGAPPED: "0"
  AI_USAGE_AGENT_MAX_TOKENS_BUDGET: ""

  # Application Mode
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: "1"
  
  # Web URL (will be overridden by overlay for production domain)
  WEB_URL: "http://plane.example.com"
  # App base URL (mirrors WEB_URL — overridden by overlay for production domain)
  APP_BASE_URL: "http://plane.example.com"
  # Pi (overridden by overlay when Pi is enabled)
  PI_BASE_URL: ""
  PI_BASE_PATH: "/pi"

  # Attachment Configuration
  ALLOW_ALL_ATTACHMENT_TYPES: ""

  # Integration event stream (shared by api, worker, beat-worker, integration-event-consumer)
  INTEGRATION_EVENT_STREAM_EXCHANGE_NAME: "plane.integration_stream"
  INTEGRATION_EVENT_CONSUMER_QUEUE_NAME: "plane.integration_stream.reference"
  INTEGRATION_EVENT_CONSUMER_PREFETCH: "10"
  INTEGRATION_EVENT_MAX_RAW_BYTES: "262144"
  INTEGRATION_EVENT_PUBLISH_TIMEOUT: "2.0"
  INTEGRATION_EVENT_PUBLISH_MAX_RETRIES: "2"
  INTEGRATION_EVENT_PUBLISH_RETRY_DELAY: "0.05"
  INTEGRATION_EVENT_REPUBLISH_BATCH_SIZE: "500"
  INTEGRATION_EVENT_REPUBLISH_MAX_ATTEMPTS: "10"
  INTEGRATION_EVENT_REPUBLISH_GRACE_SECONDS: "60"
  INTEGRATION_EVENT_CLEANER_BATCH_SIZE: "1000"
  INTEGRATION_EVENT_CLEANER_CUTOFF_DAYS: "7"
  INTEGRATION_EVENT_COLLECTION_NAME: "integration_event"

  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "http://plane.example.com,https://plane.example.com"
  
  # Sentry (optional monitoring)
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ""

  # AWS Secrets Manager key mappings (overridden per-environment via overlays)
  REDIS_AUTH_TOKEN_KEY: ""
  RABBITMQ_USER_KEY: ""
  RABBITMQ_PASSWORD_KEY: ""
  RDS_DB_NAME_KEY: ""
  RDS_DB_HOST_KEY: ""
  RDS_DB_PASSWORD_KEY: ""
  RDS_DB_PORT_KEY: ""
  RDS_DB_USERNAME_KEY: ""
  AWS_SECRET_CACHE_TTL: "300"
