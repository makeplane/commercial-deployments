apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-silo-vars
  namespace: plane
data:
  PORT: "3000"
  BATCH_SIZE: "100"
  MQ_PREFETCH_COUNT: "1"
  REQUEST_INTERVAL: "400"
  SILO_BASE_PATH: "/silo"
  # Default queue, consumed by the base worker. The worker-importers component
  # overrides this to "celery.importer" when it adds its dedicated consumer --
  # base must not name a queue that nothing is listening on.
  IMPORTERS_QUEUE_NAME: "celery"

  CORS_ALLOWED_ORIGINS: "*"

  APP_BASE_URL: "https://plane.example.com"
  # Points at the API that base always ships. The external-api component
  # overrides this to plane-external-api when it is enabled -- base must not
  # depend on a Service that only an optional component creates.
  API_BASE_URL: "http://plane-api:8000/"
  SILO_API_BASE_URL: "https://plane.example.com"

  PAYMENT_SERVER_BASE_URL: "http://plane-monitor:8080/"
  FEATURE_FLAG_SERVER_BASE_URL: "http://plane-monitor:8080/"

  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"

  AWS_SECRET_CACHE_TTL: "300"

  # Integration event stream ingest — normalized webhooks Silo forwards to Plane.
  INTEGRATION_EVENT_INGEST_ENABLED: "0"
  INTEGRATION_EVENT_PROVIDERS: "github,gitlab,slack"
  INTEGRATION_EVENT_INGEST_TIMEOUT_MS: "2000"
