      - select: { kind: Secret, name: plane-live-secrets }
        fieldPaths: [stringData.REDIS_SENTINEL_PASSWORD]
      - select: { kind: Secret, name: plane-silo-secrets }
        fieldPaths: [stringData.REDIS_SENTINEL_PASSWORD]
      - select: { kind: Secret, name: plane-flux-secrets }
        fieldPaths: [stringData.REDIS_SENTINEL_PASSWORD]
      - select: { kind: Secret, name: plane-mcp-server-secrets }
