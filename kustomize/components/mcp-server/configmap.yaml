apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-mcp-server-vars
  namespace: plane
data:
  FASTMCP_PORT: "8211"
  MCP_PATH_PREFIX: /mcp
  PLANE_BASE_URL: ""               # replaced from overlay-vars WEB_URL
  PLANE_INTERNAL_BASE_URL: ""      # replaced from overlay-vars MCP_PLANE_INTERNAL_BASE_URL
  PLANE_OAUTH_PROVIDER_BASE_URL: "" # replaced from overlay-vars WEB_URL

  # ElastiCache / AWS Secrets Manager auth-token path (server.py:36)
  # Triggered when REDIS_HOST, REDIS_PORT and ELASTICACHE_SECRET_ARN are set.
  REDIS_PORT: "6379"                # replaced from overlay-vars REDIS_PORT
  REDIS_AUTH_TOKEN_KEY: "authToken" # replaced from overlay-vars REDIS_AUTH_TOKEN_KEY (JSON key inside the secret)
  AWS_REGION: "us-east-1"           # replaced from overlay-secret-vars AWS_REGION
  AWS_SECRET_CACHE_TTL: "300"       # replaced from overlay-vars AWS_SECRET_CACHE_TTL
