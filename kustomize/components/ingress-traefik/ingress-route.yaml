apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-ingress-route
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/spaces/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-space
          port: 3000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/god-mode/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-admin
          port: 3000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/api/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/auth/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/graphql/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/marketplace/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/dav/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/live/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-live
          port: 3000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/silo/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-silo
          port: 3000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/pi/`)
      services:
        - name: plane-pi-api
          port: 8000
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-web
          port: 3000
    # draw.io diagram editor (subpath /drawio). Only functional when the draw-io
    # component is also enabled in the overlay. Traefik prioritises by rule
    # length, so this longer rule wins over the catch-all `/` route above.
    # Route index 11 — overlays patch the Host in this match by index.
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/drawio`)
      middlewares:
        - name: drawio-redirect-slash
        - name: drawio-stripprefix
        - name: plane-body-limit
      services:
        - name: plane-draw-io
          port: 8080
    # In-cluster MinIO object storage (subpath /uploads). Only functional when the
    # minio component is also enabled in the overlay; with external S3 this route
    # is unused and harmless (Traefik degrades just this router).
    #
    # REQUIRED whenever minio is enabled: the backend runs with USE_MINIO=1 and
    # hands browsers URLs under this path, so without it every attachment and
    # uploaded file 404s.
    #
    # Traefik prioritises by rule length, so position does not affect routing.
    # Deliberately appended LAST so the existing route indices 0-11 do not shift
    # — overlays patch each route's Host by index, and inserting anywhere earlier
    # silently rewires those overlays' paths to the wrong backends.
    # Route index 12 — overlays patch the Host in this match by index.
    - kind: Rule
      match: Host(`plane.example.com`) && PathPrefix(`/uploads`)
      middlewares:
        - name: plane-body-limit
      services:
        - name: plane-minio
          port: 9000
  tls:
    secretName: plane-ssl-cert
