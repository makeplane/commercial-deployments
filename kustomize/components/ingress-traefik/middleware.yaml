apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 5242880
---
# draw.io is served under the /drawio subpath. The makeplane/drawio image serves
# its webapp at "/", so strip the prefix before forwarding to plane-draw-io:8080.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: drawio-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /drawio
---
# draw.io references all assets relatively (js/, styles/, images/, mxBasePath),
# so the page must be loaded with a trailing slash for them to resolve under
# /drawio/. Redirect the bare /drawio -> /drawio/ (regex only matches the exact
# path, so deeper asset requests pass through untouched).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: drawio-redirect-slash
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/drawio$
    replacement: ${1}/drawio/
    permanent: true
