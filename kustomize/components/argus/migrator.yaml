apiVersion: batch/v1
kind: Job
metadata:
  name: plane-argus-migrator
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-enterprise
    app.kubernetes.io/component: argus-migrator
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-enterprise
        app.kubernetes.io/component: argus-migrator
      annotations:
        # Job spec.template is immutable: delete the completed Job first
        # (kubectl -n plane delete job plane-argus-migrator), then bump this
        # timestamp and re-apply. Use: date +%Y%m%d-%H%M%S
        run-timestamp: "20260828-000000"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: plane-srv-account
      containers:
        - name: argus-migrator
          image: makeplane/argus-cloud:v2.3.4
          imagePullPolicy: Always
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: plane-argus-vars
            - secretRef:
                name: plane-argus-secrets
          resources:
            requests:
              memory: 50Mi
              cpu: 50m
            limits:
              memory: 1000Mi
              cpu: 500m
