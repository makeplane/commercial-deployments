apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - migrator.yaml

replacements:
  # ARGUS_DATABASE_URL from overlay secrets
  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.ARGUS_DATABASE_URL
    targets:
      - select:
          kind: Secret
          name: plane-argus-secrets
        fieldPaths:
          - stringData.ARGUS_DATABASE_URL

  # ARGUS_CONTENT_DATABASE_URL from overlay secrets
  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.ARGUS_CONTENT_DATABASE_URL
    targets:
      - select:
          kind: Secret
          name: plane-argus-secrets
        fieldPaths:
          - stringData.ARGUS_CONTENT_DATABASE_URL

  # ARGUS_FINGERPRINT_SECRET from overlay secrets
  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.ARGUS_FINGERPRINT_SECRET
    targets:
      - select:
          kind: Secret
          name: plane-argus-secrets
        fieldPaths:
          - stringData.ARGUS_FINGERPRINT_SECRET

  # ARGUS_INTERNAL_SECRET from overlay secrets
  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.ARGUS_INTERNAL_SECRET
    targets:
      - select:
          kind: Secret
          name: plane-argus-secrets
        fieldPaths:
          - stringData.ARGUS_INTERNAL_SECRET

  # FEATURE_FLAG_SERVER_AUTH_TOKEN from overlay secrets
  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.ARGUS_FEATURE_FLAG_SERVER_AUTH_TOKEN
    targets:
      - select:
          kind: Secret
          name: plane-argus-secrets
        fieldPaths:
          - stringData.FEATURE_FLAG_SERVER_AUTH_TOKEN

  # CORS_ALLOWED_ORIGINS from overlay vars
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.CORS_ALLOWED_ORIGINS
    targets:
      - select:
          kind: ConfigMap
          name: plane-argus-vars
        fieldPaths:
          - data.CORS_ALLOWED_ORIGINS

  # ARGUS_TRUSTED_PROXIES from overlay vars.
  # Without this the shared component's empty default is baked into every
  # environment, so X-Forwarded-For is ignored and the audit trail records the
  # ingress IP for every action. Overlays never patch ConfigMap data directly,
  # so a replacement is the only way to make this tunable per environment
  # (same approach pi-service uses for its PI_* knobs).
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.ARGUS_TRUSTED_PROXIES
    targets:
      - select:
          kind: ConfigMap
          name: plane-argus-vars
        fieldPaths:
          - data.ARGUS_TRUSTED_PROXIES

  # ARGUS_METRICS_ADDR from overlay vars (loopback default is unscrapable)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.ARGUS_METRICS_ADDR
    targets:
      - select:
          kind: ConfigMap
          name: plane-argus-vars
        fieldPaths:
          - data.ARGUS_METRICS_ADDR
