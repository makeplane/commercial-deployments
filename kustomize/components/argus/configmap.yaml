apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-argus-vars
  namespace: plane
data:
  ARGUS_SCHEMA: "argus"
  # Must match the ingress path that routes to plane-argus:8100
  # (base/ingress.yaml and components/ingress-traefik/ingress-route.yaml).
  ARGUS_BASE_PATH: "/argus"
  ARGUS_PORT: "8100"
  API_INTERNAL_URL: "http://plane-api:8000"
  # Prometheus metrics listener. Driven from ARGUS_METRICS_ADDR in the overlay's
  # vars.yaml. Defaults to loopback, which means nothing outside the container
  # can scrape it; set it to "0.0.0.0:9100" in vars.yaml (and add a matching
  # containerPort/ServiceMonitor) if you actually collect these metrics.
  ARGUS_METRICS_ADDR: "127.0.0.1:9100"
  CORS_ALLOWED_ORIGINS: ""
  # Driven from ARGUS_TRUSTED_PROXIES in the overlay's vars.yaml.
  # Argus fails closed: while this is empty it ignores X-Forwarded-For, so every
  # audit_event (scan trigger, triage, allow-list change, export, download)
  # records the ingress pod's IP instead of the end user's. Every overlay here
  # fronts services with an ingress, so set this to your ingress/pod CIDR (or the
  # proxy IPs) in vars.yaml if the audit trail needs real client IPs.
  ARGUS_TRUSTED_PROXIES: ""
  ARGUS_WORKER_POOL: ""
  ARGUS_DEFAULT_RATE_RPS: "500"
  ARGUS_MAX_RATE_RPS: "10000"
  FEATURE_FLAG_SERVER_BASE_URL: "http://plane-monitor:8080"

  # --- AWS Secrets Manager database credentials (IRSA / EKS Pod Identity) ---
  # Wholly inert unless RDS_SECRET_ARN (in plane-argus-secrets) is set AND the
  # pod carries an IRSA or Pod Identity credential. With neither, argus makes no
  # AWS call at all, which is what keeps the non-AWS and air-gapped overlays
  # unaffected by any of this.
  #
  # argus deliberately reuses the APP's RDS_SECRET_ARN rather than owning one:
  # it creates the argus schema inside the Plane database and reads Plane's
  # content from public there, so it is the same database and the same
  # credentials. Consequence worth knowing: argus then connects as the app's DB
  # role, and `argus migrate` needs CREATE on ARGUS_SCHEMA. Set
  # ARGUS_RDS_SECRET_ARN (in plane-argus-secrets) to point at a dedicated secret
  # instead.
  #
  # Empty AWS_REGION is fine: argus falls back to us-east-1, matching the API.
  AWS_REGION: ""
  AWS_SECRET_CACHE_TTL: "300"
  # Reader endpoint for content scans while still rotating through the one
  # secret. Ignored when ARGUS_CONTENT_DATABASE_URL is set, which stays a
  # complete static DSN with its own embedded credentials.
  ARGUS_CONTENT_DB_HOST: ""
  # JSON key names inside the secret. Empty means argus uses its own defaults --
  # username/password/host/port/dbname, the names AWS generates for an RDS
  # secret, which is also exactly what the phoenix overlay sets for every other
  # workload. Only a non-standard secret shape needs these.
  RDS_DB_USERNAME_KEY: ""
  RDS_DB_PASSWORD_KEY: ""
  RDS_DB_HOST_KEY: ""
  RDS_DB_PORT_KEY: ""
  RDS_DB_NAME_KEY: ""
