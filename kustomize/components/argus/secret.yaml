apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: plane-argus-secrets
  namespace: plane
stringData:
  ARGUS_DATABASE_URL: ""
  ARGUS_CONTENT_DATABASE_URL: ""
  ARGUS_FINGERPRINT_SECRET: ""
  ARGUS_INTERNAL_SECRET: ""
  FEATURE_FLAG_SERVER_AUTH_TOKEN: ""
  # AWS Secrets Manager ARN for the Postgres credentials, reused from the app
  # because argus lives in the same database. Empty keeps the static
  # ARGUS_DATABASE_URL path and makes no AWS call at all.
  #
  # Set alongside ARGUS_DATABASE_URL they combine rather than compete: the secret
  # owns the credentials, the DSN owns the endpoint. Leaving the DSN empty makes
  # the secret supply both.
  RDS_SECRET_ARN: ""
  # Overrides RDS_SECRET_ARN when argus should use a DEDICATED database role
  # instead of the app's. Empty (the default) falls back to RDS_SECRET_ARN above,
  # so leaving it alone changes nothing.
  #
  # Worth knowing before setting it: argus creates and migrates its own schema, so
  # a dedicated role needs CREATE on ARGUS_SCHEMA, and it must be able to SELECT
  # Plane's content tables in public.
  ARGUS_RDS_SECRET_ARN: ""
