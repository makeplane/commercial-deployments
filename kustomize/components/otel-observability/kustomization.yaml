apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# ============================================================
# OTEL OBSERVABILITY (backend-api)
# ============================================================
# Injects OpenTelemetry environment variables into the backend workloads
# (plane-api-wl, plane-silo-wl) by appending the plane-otel-vars ConfigMap to
# each container's envFrom.
#
# VALUES LIVE IN vars.yaml: the keys in configmap.yaml are placeholders; the
# actual values are supplied per-overlay from overlay-vars (vars.yaml) via the
# OTEL replacements added in the overlay's kustomization.yaml.
#
# PER-SERVICE service.name: the shared plane-otel-vars ConfigMap carries
# OTEL_SERVICE_NAME for the api (from vars.yaml). silo gets the SAME ConfigMap
# but an inline env OTEL_SERVICE_NAME=silo that overrides it (inline env wins
# over envFrom), so each workload reports its own service.name in traces.
#
# OPTIONAL / OPT-IN: the env vars are added ONLY when this component is enabled
# in the overlay. To leave OTEL off entirely, do not enable this component — no
# OTEL env vars are then set on the api container. To drop a single variable,
# remove its key from configmap.yaml and its replacement from the overlay.
#
# ORDERING: this envFrom entry is appended LAST. Enable this component AFTER
# custom-ca so the OTEL ConfigMap lands after the CA env ConfigMap.
#
# Usage — enable in your overlay's kustomization.yaml and add the OTEL
# replacements + vars (see overlays/phoenix for a worked example):
#   components:
#     - ../../components/otel-observability
# ============================================================

resources:
  - configmap.yaml

patches:
  - path: patches/append-otel-envfrom.json
    target:
      kind: Deployment
      name: plane-api-wl
  - path: patches/append-otel-silo.json
    target:
      kind: Deployment
      name: plane-silo-wl
