apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-otel-vars
  namespace: plane
data:
  # OpenTelemetry instrumentation for the backend-api workload.
  #
  # These keys are PLACEHOLDERS — their real values are sourced from the overlay's
  # vars.yaml (overlay-vars ConfigMap) via the OTEL replacements in the overlay
  # kustomization.yaml. Leave a key empty here; set its value in vars.yaml.
  #
  # Optionality: the whole block is opt-in (enable this component in the overlay).
  # To leave an individual variable unset, delete its line here AND the matching
  # replacement in the overlay kustomization.yaml.
  OTEL_ENABLED: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_PROTOCOL: ""
  OTEL_SERVICE_NAME: ""
  # Set deployment.environment.name (the CURRENT semconv key — NOT the legacy
  # deployment.environment) so the API's environment tag matches the node/pi/
  # browser services and cross-service "environment=" filtering works in Tempo.
  OTEL_RESOURCE_ATTRIBUTES: ""
  OTEL_DEBUG_CONSOLE: ""
  # Trace sampling. Two independent gotchas:
  #   1. Ratio: the app defaults to parentbased_traceidratio @ 0.1 (10%), so 90%
  #      of root requests are NOT exported (their logs show trace_flags=0).
  #   2. Parent-based: ANY parentbased_* sampler DEFERS to an incoming traceparent's
  #      sampled flag and IGNORES the ARG ratio. With FRONTEND_OTEL_ENABLED=1 the
  #      browser/proxy sends a traceparent; if it didn't sample (flag=0), the API
  #      span is DROPPED regardless of ARG=1.0 — the classic "only GET traffic
  #      (rootspans) shows up, no POST/user-action traces" symptom.
  # => For a test/load/debug env, use always_on (captures every span the service
  #    sees, ignores upstream decisions). For prod, use parentbased_traceidratio
  #    with a sane ARG AND make sure browser tracing samples consistently.
  OTEL_TRACES_SAMPLER: ""
  OTEL_TRACES_SAMPLER_ARG: ""
  # Browser/client tracing for web/admin/space. The API serves these to browsers
  # via its public instance endpoint (is_otel_enabled/otlp_endpoint/otlp_headers),
  # so they only need to be set on the API — which already consumes this ConfigMap.
  # Read ONLY by the API; a no-op env on silo/live/space.
  FRONTEND_OTEL_ENABLED: ""
  FRONTEND_OTLP_ENDPOINT: ""
  FRONTEND_OTLP_HEADERS: ""
