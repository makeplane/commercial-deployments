apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Single-node in-cluster Redis (Valkey). To connect to a Redis Sentinel set you
# run instead, leave this component out and use ../redis-sentinel (see
# kustomize/README.md, "Redis Sentinel").

resources:
  - statefulset.yaml
  - service.yaml

patches:
  - path: patches/app-redis-url.yaml
  - path: patches/live-redis-url.yaml
