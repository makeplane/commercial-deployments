apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-opensearch
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-enterprise
    app.kubernetes.io/component: opensearch
spec:
  serviceName: plane-opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-enterprise
      app.kubernetes.io/component: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-enterprise
        app.kubernetes.io/component: opensearch
    spec:
      serviceAccountName: plane-srv-account
      # The opensearchproject/opensearch image runs as uid 1000, but a freshly
      # provisioned PersistentVolume is mounted root-owned on most CSI drivers
      # (EBS included). Without fsGroup, OpenSearch cannot create its data
      # directory and dies during bootstrap with:
      #   OpenSearchException[failed to bind service];
      #   nested: AccessDeniedException[/usr/share/opensearch/data/nodes]
      # fsGroup makes the kubelet chown the mount to gid 1000, which also repairs
      # volumes created before this was set.
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.3.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          # Run the init script as the entrypoint so the `plane` user in
          # plane-opensearch-secrets is actually created. It hashes
          # OPENSEARCH_PASSWORD, appends the user to internal_users.yml, then
          # execs the image's real entrypoint -- so this replaces nothing else.
          #
          # Previously this script was mounted at /docker-entrypoint-init.d but
          # never executed (the image's default entrypoint ignores that
          # directory), and DISABLE_SECURITY_PLUGIN=true was set alongside it.
          # The component was therefore half-wired: it shipped the credentials
          # and the user-creation script, but ran a cluster with plain HTTP, no
          # auth and no `plane` user.
          #
          # That silently breaks Pi, whose OpenSearch client dials HTTPS
          # unconditionally (it ignores the scheme in OPENSEARCH_URL). Against an
          # HTTP-only cluster it gets connection-refused and falls back to
          # text-only BM25 search, reporting only a warning. The
          # plane-enterprise Helm chart runs the plugin ENABLED for this reason.
          command:
            - /bin/bash
            - /docker-entrypoint-init.d/create-user.sh
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: performance
          envFrom:
            - secretRef:
                name: plane-opensearch-secrets
          env:
            - name: discovery.type
              value: single-node
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "Secure@Pass#123!%^&*"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - mountPath: /docker-entrypoint-init.d
              name: plane-opensearch-init
          # Without a probe the container stays "Running" even when OpenSearch
          # failed to bootstrap, so the pod reports 1/1 Ready and the failure is
          # invisible -- it only surfaces two services away, as connection-refused
          # errors in the API and Pi. Gate readiness on the port actually
          # accepting connections. Generous failureThreshold: a cold start on a
          # small node can take a couple of minutes.
          #
          # tcpSocket rather than httpGet on purpose. With the security plugin
          # enabled (see the command above) /_cluster/health is TLS-only and
          # requires basic auth, so an httpGet probe gets a TLS error or a 401 and
          # the pod would never become Ready. A TCP check is scheme- and
          # auth-agnostic, and still catches the failure mode that motivated this:
          # a bootstrap crash means nothing is listening at all.
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: 750m
      volumes:
      - name: plane-opensearch-init
        configMap:
          name: plane-opensearch-init
          defaultMode: 0755
          items:
          - key: create-user.sh
            path: create-user.sh
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ''
        resources:
          requests:
            storage: 5Gi
