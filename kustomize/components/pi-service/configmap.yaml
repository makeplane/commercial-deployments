apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-pi-api-vars
  namespace: plane
data:
  DEBUG: "0"
  FASTAPI_APP_HOST: "0.0.0.0"
  FASTAPI_APP_WORKERS: "1"

  PLANE_FRONTEND_URL: "http://plane.example.com"
  PLANE_API_HOST: "http://plane.example.com"

  FEATURE_FLAG_SERVER_BASE_URL: "http://plane-monitor:8080"
  PI_BASE_PATH: "/pi"
  LIVE_BASE_URI: ""
  CORS_ALLOWED_ORIGINS: "http://plane.example.com,https://plane.example.com"
  PLANE_OAUTH_REDIRECT_URI: "http://plane.example.com/pi/api/v1/oauth/callback/"
  PLANE_OAUTH_STATE_EXPIRY_SECONDS: "82800"

  OPENAI_BASE_URL: ""
  CLAUDE_BASE_URL: ""
  COHERE_BASE_URL: ""
  GROQ_BASE_URL: ""

  AI_USAGE_AGENT_MAX_TOKENS_BUDGET: ""
  AI_USAGE_ENFORCEMENT_ENABLED: "1"

  CUSTOM_LLM_ENABLED: "true"
  CUSTOM_LLM_MODEL_KEY: "gpt-oss-120b"
  CUSTOM_LLM_BASE_URL: ""
  CUSTOM_LLM_NAME: "GPT-OSS-120B"
  CUSTOM_LLM_MAX_TOKENS: "64000"
  CUSTOM_LLM_PROVIDER: "bedrock"
  CUSTOM_LLM_AWS_REGION: "us-east-2"
  MODEL_CUSTOM_LLM_API_KEY: ""
  # Which JSON field to read out of MODEL_SECRET_ARN for each vendor. pi skips a
  # provider whose env var is already set (config.py:370-383), so these only matter
  # when the key is NOT delivered by some other means.
  #
  # Emptying one is also the documented way to take a provider OUT of service while
  # leaving its value in the secret: with no field name, secret.get("", "") returns
  # "" and has_provider_key() stays false, so get_active_models drops that vendor's
  # models from the picker.
  MODEL_OPENAI_KEY: ""
  MODEL_CLAUDE_KEY: ""
  MODEL_COHERE_KEY: ""
  MODEL_GROQ_KEY: ""
  MODEL_BASETEN_KEY: ""
  MODEL_XAI_KEY: ""
  MODEL_META_KEY: ""

  EMBEDDING_MODEL: "bedrock/amazon.titan-embed-text-v1"
  OPENSEARCH_ML_MODEL_ID: ""

  BR_AWS_ACCESS_KEY_ID: ""
  BR_AWS_REGION: "us-east-1"

  CELERY_VECTOR_SYNC_ENABLED: "0"
  CELERY_VECTOR_SYNC_INTERVAL: "3"
  CELERY_WORKSPACE_PLAN_SYNC_ENABLED: "0"
  CELERY_WORKSPACE_PLAN_SYNC_INTERVAL: "86400"
  CELERY_DOCS_SYNC_ENABLED: "0"
  CELERY_DOCS_SYNC_INTERVAL: "86400"

  # AWS Secrets Manager key mappings (overridden per-environment via overlays)
  RABBITMQ_PASSWORD_KEY: ""
  RABBITMQ_USER_KEY: ""
  # HOST/PORT/VHOST complete the set. pi reads all five out of AMAZONMQ_SECRET_ARN
  # (pi/config.py:966-976) and composes amqps://user:pass@host:port/vhost itself, so
  # without these an AmazonMQ deployment still needs a literal broker URL.
  #
  # pi does NOT read plane-app-vars, which is why these are duplicated here rather
  # than inherited from base/configs/app-configmap.yaml.
  #
  # Present-but-empty is required: a kustomize replacement overwrites and never
  # creates, so an overlay targeting a key this component omits fails the render.
  RABBITMQ_HOST_KEY: ""
  RABBITMQ_PORT_KEY: ""
  RABBITMQ_VHOST_KEY: ""

  RDS_DB_HOST_KEY: ""
  RDS_DB_NAME_KEY: ""
  RDS_DB_PASSWORD_KEY: ""
  RDS_DB_PORT_KEY: ""
  RDS_DB_USERNAME_KEY: ""

  FOLLOWER_RDS_DB_HOST_KEY: ""
  FOLLOWER_RDS_DB_NAME_KEY: ""
  FOLLOWER_RDS_DB_PASSWORD_KEY: ""
  FOLLOWER_RDS_DB_PORT_KEY: ""
  FOLLOWER_RDS_DB_USERNAME_KEY: ""

  AWS_SECRET_CACHE_TTL: "300"

  LIVE_BASE_URL: "http://plane-live:3000"
  LIVE_BASE_PATH: "/live"
  LIVE_SERVER_SECRET_KEY: "replace_with_random_secret_key"
