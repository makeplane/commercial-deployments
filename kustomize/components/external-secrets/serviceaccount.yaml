# ServiceAccount the SecretStore authenticates as.
#
# Separate from plane-srv-account on purpose. External Secrets' auth.jwt is
# sts:AssumeRoleWithWebIdentity (IRSA), so the role it names needs an OIDC trust
# policy -- whereas the Plane workloads reach AWS through an EKS Pod Identity
# association, whose trust policy is pods.eks.amazonaws.com. The two cannot share
# one role unless that role trusts both principals.
#
# Keeping them apart is also the safer split: this identity only needs to read
# this environment's secrets, and nothing runs under this ServiceAccount, so it
# cannot be borrowed by an application pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-eso-sa
  namespace: plane
  annotations:
    # Replaced from overlay-secret-vars ESO_ROLE_ARN.
    eks.amazonaws.com/role-arn: ""
