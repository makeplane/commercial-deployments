# Application keys, delivered as their own Secret rather than merged into
# plane-app-secrets.
#
# plane-app-secrets is rendered by kustomize and populated by replacements, so an
# ExternalSecret targeting it would be a second writer: kustomize would reapply the
# committed value, ESO would resync the remote one, and the two would flap. A
# separate Secret added LAST to each workload's envFrom wins over the earlier entry
# without either side fighting for ownership -- and it lets the committed values be
# emptied rather than deleted, which matters because they are replacement sources.
#
# creationPolicy: Owner so the Secret is garbage-collected with this object. Nothing
# else claims this name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-keys-ext
  namespace: plane
spec:
  # Short enough that a rotation reaches the Secret quickly; the pods still need a
  # restart (or Reloader) to pick it up, because envFrom is resolved at container
  # start.
  refreshInterval: 1h
  secretStoreRef:
    name: plane-aws-secrets-manager
    kind: SecretStore
  target:
    name: plane-app-keys-ext
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: REPLACED_APP_KEYS_SECRET_ARN
        property: SECRET_KEY
    - secretKey: AES_SECRET_KEY
      remoteRef:
        key: REPLACED_APP_KEYS_SECRET_ARN
        property: AES_SECRET_KEY
    - secretKey: LIVE_SERVER_SECRET_KEY
      remoteRef:
        key: REPLACED_APP_KEYS_SECRET_ARN
        property: LIVE_SERVER_SECRET_KEY
    - secretKey: PI_INTERNAL_SECRET
      remoteRef:
        key: REPLACED_APP_KEYS_SECRET_ARN
        property: PI_INTERNAL_SECRET
