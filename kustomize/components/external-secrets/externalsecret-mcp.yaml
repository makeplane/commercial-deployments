# MCP server OAuth client credentials.
#
# The remote key names are the overlay-facing MCP_OAUTH_* spellings; the container
# reads PLANE_OAUTH_PROVIDER_*. The rename happens here, exactly as
# components/mcp-server/kustomization.yaml renames them today when they come from
# overlay-secret-vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-mcp-oauth-ext
  namespace: plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: plane-aws-secrets-manager
    kind: SecretStore
  target:
    name: plane-mcp-oauth-ext
    creationPolicy: Owner
  data:
    - secretKey: PLANE_OAUTH_PROVIDER_CLIENT_ID
      remoteRef:
        key: REPLACED_MCP_SECRET_ARN
        property: MCP_OAUTH_CLIENT_ID
    - secretKey: PLANE_OAUTH_PROVIDER_CLIENT_SECRET
      remoteRef:
        key: REPLACED_MCP_SECRET_ARN
        property: MCP_OAUTH_CLIENT_SECRET
