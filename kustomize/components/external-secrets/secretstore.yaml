# Namespaced SecretStore, not a ClusterSecretStore: this grants read access to one
# environment's secrets and should not be reachable from other namespaces.
#
# auth.jwt rather than implicit controller auth, because the External Secrets
# controller on plane-eks-dev runs with a plain ServiceAccount and no role of its
# own (see gitops/fleet/dev/addons/external-secrets/fleet.yaml -- plane-eks-dev
# "match[es] no customization ... they get a clean SA"). With no explicit auth the
# store would fall back to that identity and fail with AccessDenied.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: plane-aws-secrets-manager
  namespace: plane
spec:
  provider:
    aws:
      service: SecretsManager
      # Replaced from overlay-secret-vars AWS_REGION.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: plane-eso-sa
