apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: plane-iframely-secrets
  namespace: plane
stringData:
  # AWS Secrets Manager ARN of the ElastiCache secret holding the auth token.
  # iframely reads the token from this secret under the REDIS_AUTH_TOKEN_KEY key.
  ELASTICACHE_SECRET_ARN: "" # replaced from overlay-secret-vars ELASTICACHE_SECRET_ARN
