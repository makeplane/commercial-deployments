apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: plane-node-runner-secrets
  namespace: plane
stringData:
  # Verifies the api's signed calls. node-runner exits at startup when this is
  # empty and NODE_ENV=production. The overlay fills it, and the api's copy in
  # plane-app-secrets, from the one RUNNER_HMAC_SECRET_KEY in secrets-vars.yaml.
  RUNNER_HMAC_SECRET_KEY: ""
