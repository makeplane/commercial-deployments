apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plane-ns

resources:
  - ../../base
  - vars.yaml
  - secrets-vars.yaml

# Include ALL infrastructure components (local)
components:
  - ../../components/email-service
  - ../../components/flux
  - ../../components/flux-consumer
  # Webhook consumer (RabbitMQ consumer for webhook delivery)
  - ../../components/webhook-consumer
  # Optional: enable EKS IRSA role annotation on plane-srv-account
  - ../../components/eks-irsa-plane-serviceaccount
  # Ingress controller: pick ONE based on INGRESS_CLASS in vars.yaml.
  # Rule: if INGRESS_CLASS starts with "traefik" → enable ingress-traefik.
  #       otherwise → enable ingress-nginx (the default).
  # Install the matching controller separately.
  # - ../../components/ingress-nginx
  - ../../components/ingress-traefik
  # - ../../components/aws-load-balancer-controller
  # Optional: enable when providing static DATABASE_URL; omit when using IRSA/EKS Pod Identity with RDS_SECRET_ARN
  # - ../../components/static-db-url
  # Optional: enable when using external OpenSearch with username/password auth
  # - ../../components/opensearch-external-auth
  # Optional: enable when using static AWS keys for S3; omit when using IRSA via eks-irsa-plane-serviceaccount
  # - ../../components/s3-static-credentials
  # Pi service (AI/Intelligence features)
  - ../../components/pi-service
  # Node runner service (automation script execution)
  - ../../components/runner
  # MCP server (Model Context Protocol — AI tool access to Plane)
  - ../../components/mcp-server
  # External API (cloud-entrypoint API workload)
  - ../../components/external-api
  # Worker importers (celery.importer queue)
  - ../../components/worker-importers
  # DBOS worker (durable workflow execution)
  - ../../components/dbos-worker
  # Optional: enable non-root security context on all workload Deployments (recommended for hardened environments)
  # Keep this AFTER pi-service and mcp-server so it patches all workloads.
  - ../../components/nonroot-security-context
  # Optional: mount a custom CA certificate into all containers.
  # Paste your CA cert (PEM) into ../../components/custom-ca/customCA.crt, then uncomment:
  - ../../components/custom-ca
  # iframely ElastiCache/redis cache. MUST come after custom-ca: it appends to the
  # envFrom array that custom-ca creates on the base iframely deployment.
  - ../../components/iframely
  # draw.io diagram editor (cluster-internal). MUST come after nonroot-security-context
  # and custom-ca: it has no envFrom (like iframely) and its third-party image should
  # not be patched by those components, which target all plane-enterprise Deployments.
  - ../../components/draw-io
  # Uncomment these if you want to deploy the infrastructure components locally
  # - ../../components/postgres
  # - ../../components/redis
  # - ../../components/rabbitmq
  # - ../../components/minio
  # - ../../components/opensearch

# ============================================================
# APPLICATION VERSION - CUSTOMIZE THIS FOR UPGRADES
# ============================================================
# Current Version: v2.5.0 (also defined in vars.yaml for ConfigMap replacements)
# ============================================================
# Image tags for all makeplane/*-commercial workloads are driven from
# APP_VERSION in vars.yaml at build time (see the APP_VERSION replacement
# below). The `newTag` values here exist ONLY so the `images:` transformer
# tags bare image references injected by patches (e.g. custom-ca's init
# container) — they are ALWAYS overridden by the replacement.
# To bump versions, edit APP_VERSION in vars.yaml. Do not edit these tags.
images:
  - name: makeplane/backend-commercial
    newTag: app-version-driven
  - name: makeplane/web-commercial
    newTag: app-version-driven
  - name: makeplane/space-commercial
    newTag: app-version-driven
  - name: makeplane/admin-commercial
    newTag: app-version-driven
  - name: makeplane/live-commercial
    newTag: app-version-driven
  - name: makeplane/monitor-commercial
    newTag: app-version-driven
  - name: makeplane/silo-commercial
    newTag: app-version-driven
  - name: makeplane/email-commercial
    newTag: app-version-driven
  - name: makeplane/flux-commercial
    newTag: app-version-driven
  - name: makeplane/plane-pi-commercial
    newTag: app-version-driven
  - name: makeplane/node-runner-commercial
    newTag: app-version-driven
  # Independent versioning — not driven by APP_VERSION:
  - name: makeplane/iframely
    newTag: v2.5.3
  - name: makeplane/plane-mcp-server
    newTag: v2.5.0-phoenix-b5ad5360

# Most configuration flows through replacements (below). The IngressRoute host
# can't be reached by a Kustomize replacement (it lives inside a Traefik `match`
# expression string), so we patch each route's match here.
patches:
  - target:
      kind: IngressRoute
      name: plane-ingress-route
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/spaces/`)
      - op: replace
        path: /spec/routes/1/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/god-mode/`)
      - op: replace
        path: /spec/routes/2/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/api/`)
      - op: replace
        path: /spec/routes/3/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/auth/`)
      - op: replace
        path: /spec/routes/4/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/graphql/`)
      - op: replace
        path: /spec/routes/5/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/marketplace/`)
      - op: replace
        path: /spec/routes/6/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/live/`)
      - op: replace
        path: /spec/routes/7/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/silo/`)
      - op: replace
        path: /spec/routes/8/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/pi/`)
      - op: replace
        path: /spec/routes/9/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/10/match
        value: Host(`commercial.loadtest.plane.town`) && PathPrefix(`/drawio`)

# ============================================================
# REPLACEMENTS - Using vars.yaml and secrets-vars.yaml as source of truth
# ============================================================
# This feature automatically replaces values across multiple resources
#
# vars.yaml (ConfigMap) - Non-sensitive values:
#   - APP_VERSION, APP_DOMAIN, NAMESPACE, INGRESS_CLASS
#
# secrets-vars.yaml (Secret) - Sensitive values:
#   - DATABASE_URL, REDIS_URL, AMQP_URL, OpenSearch creds, etc.
# ============================================================
replacements:
  # ====== FROM vars.yaml (ConfigMap) ======
  # Replace APP_VERSION in plane-monitor-vars ConfigMap
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.APP_VERSION
    targets:
      - select:
          kind: ConfigMap
          name: plane-monitor-vars
        fieldPaths:
          - data.APP_VERSION
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.APP_VERSION

  # Drive every workload's image tag from APP_VERSION (single source of truth).
  # plane-iframely-wl and plane-mcp-server have independent versioning for their MAIN
  # container, so both are rejected from the containers.*.image target. Their INIT
  # containers (added by custom-ca) tell a different story:
  #   - iframely-wl's init container uses the iframely image → keep on v1.2.0 → reject
  #   - mcp-server's init container uses backend-commercial (custom-ca default) → follows APP_VERSION
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.APP_VERSION
    targets:
      - select:
          kind: Deployment
        reject:
          - name: plane-iframely-wl
          - name: plane-mcp-server
          - name: plane-draw-io-wl   # pinned makeplane/drawio tag — not APP_VERSION-driven
        fieldPaths:
          - spec.template.spec.containers.*.image
        options:
          delimiter: ":"
          index: 1
      - select:
          kind: Deployment
        reject:
          - name: plane-iframely-wl
          - name: plane-draw-io-wl   # no init container (added after custom-ca)
        fieldPaths:
          - spec.template.spec.initContainers.*.image
        options:
          delimiter: ":"
          index: 1
      - select:
          kind: StatefulSet
          name: plane-monitor
        fieldPaths:
          - spec.template.spec.containers.*.image
          - spec.template.spec.initContainers.*.image
        options:
          delimiter: ":"
          index: 1
      - select:
          kind: Job
        fieldPaths:
          - spec.template.spec.containers.*.image
          - spec.template.spec.initContainers.*.image
        options:
          delimiter: ":"
          index: 1

  # Replace APP_DOMAIN in ConfigMaps
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.APP_DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.APP_DOMAIN
      - select:
          kind: ConfigMap
          name: plane-monitor-vars
        fieldPaths:
          - data.APP_DOMAIN

  # Replace APP_DOMAIN in Ingress host
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.APP_DOMAIN
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host

  # Replace APP_DOMAIN in MCP ingress TLS host
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.APP_DOMAIN
    targets:
      - select:
          kind: Ingress
          name: plane-mcp-ingress
        fieldPaths:
          - spec.tls.0.hosts.0

  # Replace INGRESS_CLASS in Ingress
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.INGRESS_CLASS
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.ingressClassName

  # Replace WEB_URL in plane-app-vars
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.WEB_URL
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.WEB_URL
          - data.APP_BASE_URL
      - select:
          kind: ConfigMap
          name: plane-silo-vars
        fieldPaths:
          - data.APP_BASE_URL
          - data.SILO_API_BASE_URL


  # Replace CORS_ALLOWED_ORIGINS in plane-app-vars
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.CORS_ALLOWED_ORIGINS
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.CORS_ALLOWED_ORIGINS

  # Replace ALLOW_ALL_ATTACHMENT_TYPES in plane-app-vars (leave empty in vars.yaml to disable)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.ALLOW_ALL_ATTACHMENT_TYPES
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.ALLOW_ALL_ATTACHMENT_TYPES

  # Replace IS_AIRGAPPED in plane-monitor-vars
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.IS_AIRGAPPED
    targets:
      - select:
          kind: ConfigMap
          name: plane-monitor-vars
        fieldPaths:
          - data.IS_AIRGAPPED
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.IS_AIRGAPPED

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.AWS_SECRET_CACHE_TTL
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.AWS_SECRET_CACHE_TTL
      - select:
          kind: ConfigMap
          name: plane-silo-vars
        fieldPaths:
          - data.AWS_SECRET_CACHE_TTL
      - select:
          kind: ConfigMap
          name: plane-live-vars
        fieldPaths:
          - data.AWS_SECRET_CACHE_TTL
      - select:
          kind: ConfigMap
          name: plane-mcp-server-vars
        fieldPaths:
          - data.AWS_SECRET_CACHE_TTL

  # Monitor StatefulSet storage class (from vars.yaml)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.MONITOR_STORAGE_CLASS
    targets:
      - select:
          kind: StatefulSet
          name: plane-monitor
        fieldPaths:
          - spec.volumeClaimTemplates.0.spec.storageClassName

  # PRIME_HOST in plane-app-vars (from vars.yaml)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PRIME_HOST
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.PRIME_HOST
      - select:
          kind: ConfigMap
          name: plane-monitor-vars
        fieldPaths:
          - data.PRIME_HOST

  # PI_BASE_URL in plane-app-vars and plane-live-vars (from vars.yaml)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: plane-app-vars
        fieldPaths:
          - data.PI_BASE_URL
      - select:
          kind: ConfigMap
          name: plane-live-vars
        fieldPaths:
          - data.PI_BASE_URL

  # LIVE_BASE_URI in plane-pi-api-vars (internal cluster URL, from vars.yaml)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.LIVE_BASE_URI
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.LIVE_BASE_URI

  # Pi service: PI_BASE_URL from vars -> plane-pi-api-vars.PLANE_API_HOST only
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.PLANE_API_HOST

  # Pi service: OAuth redirect URI from vars -> plane-pi-api-vars.PLANE_OAUTH_REDIRECT_URI
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_OAUTH_REDIRECT_URI
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.PLANE_OAUTH_REDIRECT_URI

  - source:
      kind: Secret
      name: overlay-secret-vars
      fieldPath: stringData.PI_INTERNAL_SECRET
    targets:
      - select:
          kind: Secret
          name: plane-app-secrets
        fieldPaths:
          - stringData.PI_INTERNAL_SECRET
      - select:
          kind: Secret
          name: plane-pi-api-secrets
        fieldPaths:
          - stringData.PI_INTERNAL_SECRET

  # AWS Secrets Manager key mappings for pi service (from PI-specific keys in vars.yaml)
  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RABBITMQ_USER_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RABBITMQ_USER_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RABBITMQ_PASSWORD_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RABBITMQ_PASSWORD_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RDS_DB_HOST_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RDS_DB_HOST_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RDS_DB_NAME_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RDS_DB_NAME_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RDS_DB_PASSWORD_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RDS_DB_PASSWORD_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RDS_DB_PORT_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RDS_DB_PORT_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_RDS_DB_USERNAME_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.RDS_DB_USERNAME_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_FOLLOWER_RDS_DB_HOST_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.FOLLOWER_RDS_DB_HOST_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_FOLLOWER_RDS_DB_NAME_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.FOLLOWER_RDS_DB_NAME_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_FOLLOWER_RDS_DB_PASSWORD_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
        fieldPaths:
          - data.FOLLOWER_RDS_DB_PASSWORD_KEY

  - source:
      kind: ConfigMap
      name: overlay-vars
      fieldPath: data.PI_FOLLOWER_RDS_DB_PORT_KEY
    targets:
      - select:
          kind: ConfigMap
          name: plane-pi-api-vars
